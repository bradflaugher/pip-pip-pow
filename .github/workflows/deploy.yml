name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://pippippow.win
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify commit is latest main
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping stale deploy ($GITHUB_SHA != $HEAD_SHA)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage public files
        if: steps.latest.outputs.deploy == 'true'
        run: |
          mkdir -p _site
          cp index.html icon.svg manifest.webmanifest _headers _site/
          test -f _site/index.html
          test -f _site/_headers
          test -f _site/manifest.webmanifest

      - name: Publish to Cloudflare Pages
        if: steps.latest.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          command: pages deploy _site --project-name=pip-pip-pow --branch=main
